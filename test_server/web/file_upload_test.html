<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Test - Xxlang Server</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .upload-form {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .file-input {
            margin: 10px 0;
        }
        .submit-btn {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background: #45a049;
        }
        .result {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            white-space: pre-wrap;
        }
        .error {
            background: #ffebee;
        }
    </style>
</head>
<body>
    <h1>File Upload Test</h1>
    <p>Test the file upload functionality of Xxlang server mode.</p>

    <div class="upload-form">
        <h2>Upload Files</h2>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="file-input">
                <label for="file1">File 1:</label>
                <input type="file" id="file1" name="file1" multiple>
            </div>
            <div class="file-input">
                <label for="file2">File 2:</label>
                <input type="file" id="file2" name="file2">
            </div>
            <button type="submit" class="submit-btn">Upload Files</button>
        </form>
    </div>

    <div id="result"></div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const resultDiv = document.getElementById('result');

            resultDiv.innerHTML = 'Uploading...';
            resultDiv.className = 'result';

            try {
                const response = await fetch('/ms/file_upload_test', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                resultDiv.innerHTML = 'Response:\n' + JSON.stringify(data, null, 2);
                resultDiv.className = data.success ? 'result' : 'result error';
            } catch (error) {
                resultDiv.innerHTML = 'Error: ' + error.message;
                resultDiv.className = 'result error';
            }
        });
    </script>
</body>
</html>
