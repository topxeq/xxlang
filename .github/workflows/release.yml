name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist

          # Build for different platforms
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/386"
            "darwin/amd64"
            "darwin/arm64"
          )

          for platform in "${platforms[@]}"; do
            IFS='/' read -r os arch <<< "$platform"
            output="dist/xxl"
            if [ "$os" = "windows" ]; then
              output="dist/xxl.exe"
            fi

            echo "Building for $os/$arch..."
            GOOS=$os GOARCH=$arch go build -ldflags="-s -w" -o "$output" ./cmd/xxl

            cd dist
            if [ "$os" = "windows" ]; then
              zip "xxlang-$os-$arch.zip" xxl.exe
            else
              tar -czf "xxlang-$os-$arch.tar.gz" xxl
            fi
            rm -f xxl xxl.exe
            cd ..
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
