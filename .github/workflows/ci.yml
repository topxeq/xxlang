name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM test plugin
        run: |
          mkdir -p pkg/plugin/testdata/target/wasm32-unknown-unknown/release
          cd examples/wasm_plugin/plugin
          rustc --target wasm32-unknown-unknown -O --crate-type cdylib -o testplugin.wasm testplugin.rs
          cp testplugin.wasm ../../../pkg/plugin/testdata/target/wasm32-unknown-unknown/release/

      - name: Run tests
        run: |
          go test -v -coverprofile=coverage.out ./pkg/... ./tests/... ./cmd/... ./benchmarks/...
          go tool cover -func coverage.out -o coverage.txt

      - name: Go Coverage Badge
        uses: tj-actions/coverage-badge-go@v3
        with:
          green: 60
          filename: coverage.txt

      - uses: stefanzweifel/git-auto-commit-action@v5
        id: auto-commit-action
        with:
          commit_message: Apply code coverage badge
          skip_fetch: true
          skip_checkout: true
          file_pattern: ./README.md

      - name: Push Changes
        if: steps.auto-commit-action.outputs.changes_detected == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ github.token }}
          branch: ${{ github.ref }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m ./pkg/...
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        run: go build -v ./cmd/xxl
